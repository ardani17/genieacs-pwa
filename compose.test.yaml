# Isolated verification stack for the genieacs-pwa check project.
#
# Everything mutating or verifying runs under project name
# `genieacs-pwa-check` with its own volumes; the Mongo instance is a
# throwaway fixture (dummy credentials below are intentionally not secrets)
# and never publishes ports to the host. The verify service reuses the
# pinned tooling image and targets database `genieacs_plan_test`, enforced
# again by scripts/check.mjs's MONGO_URL guard.

name: genieacs-pwa-check

services:
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    environment:
      MONGO_INITDB_ROOT_USERNAME: check_fixture
      MONGO_INITDB_ROOT_PASSWORD: check-fixture-only
      MONGO_INITDB_DATABASE: genieacs_plan_test
    volumes:
      - verify_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    image: genieacs-pwa-verify:local
    init: true
    working_dir: /workspace
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      MONGO_URL: mongodb://check_fixture:check-fixture-only@mongo:27017/genieacs_plan_test?authSource=admin
      # The engine reads GENIEACS_* at module load, so the harness pins the
      # test database and a dummy JWT secret here (values are fixtures, not
      # secrets).
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://check_fixture:check-fixture-only@mongo:27017/genieacs_plan_test?authSource=admin
      GENIEACS_UI_JWT_SECRET: check-fixture-jwt-secret
    volumes:
      - .:/workspace
      - verify_modules:/workspace/node_modules
      - npm_cache:/root/.npm
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node", "scripts/check.mjs", "all"]

  # PWA under test: standalone Next runtime, unprivileged, read-only root
  # with tmpfs for Next's cache/tmp dirs. No ports published —
  # browser-tests shares this service's network namespace and reaches it
  # on loopback (a valid secure context, no browser security disabled).
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: genieacs-pwa-web:local
    read_only: true
    tmpfs:
      - /app/.next/cache:size=134217728
      - /tmp:size=67108864
    environment:
      PUBLIC_ORIGIN: http://localhost:3000
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    command: ["node", "server.js"]

  browser-tests:
    build:
      context: .
      dockerfile: docker/testing/Dockerfile
    image: genieacs-pwa-browser-tests:local
    init: true
    working_dir: /workspace/apps/web
    network_mode: service:web
    environment:
      PW_BASE_URL: http://localhost:3000
      CI: "1"
    volumes:
      - .:/workspace
      - browser_test_modules:/workspace/apps/web/node_modules
    command: ["npx", "playwright", "test"]

volumes:
  verify_mongo_data:
  verify_modules:
  browser_test_modules:
  npm_cache:
