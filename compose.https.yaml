# HTTPS overlay: Caddy (digest-pinned) in front of the web app with
# operator-provided certificates mounted read-only. No certificate is
# issued automatically in this package. Client forwarding headers are NOT
# trusted (see Caddyfile) — the trusted-proxy boundary is a deployment
# decision documented in docs/deployment/docker.md.

services:
  web:
    environment:
      # Caddy is the single trusted proxy at the edge: it appends the
      # real client address to X-Forwarded-For, so the web rate limiter
      # keys on that last entry. Direct (non-overlay) deployments keep
      # the default 0 — client-supplied XFF is then discarded entirely.
      TRUSTED_PROXY_HOPS: "1"

  https:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /config:size=67108864
      - /data:size=134217728
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HTTPS_CERT_FILE:-/dev/null}:/certs/tls.crt:ro
      - ${HTTPS_KEY_FILE:-/dev/null}:/certs/tls.key:ro
    ports:
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
    networks:
      - app
    depends_on:
      - web

networks:
  app:
    driver: bridge
