name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    env:
      PR_BASE: ${{ github.base_ref }}
      PR_HEAD: ${{ github.head_ref }}
      PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Check pull request direction
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          if [[ "$PR_BASE" == "main" ]]; then
            if [[ "$PR_HEAD" != "development" || "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "Release pull requests must come from this repository's development branch."
              exit 1
            fi
          elif [[ "$PR_BASE" == "development" ]]; then
            case "$PR_HEAD" in
              feature/*|fix/*|chore/*|main) ;;
              *)
                echo "Use feature/*, fix/*, chore/*, or main for release synchronization."
                exit 1
                ;;
            esac
          fi

  verify:
    needs: branch-policy
    runs-on: ubuntu-latest
    services:
      # npm test runs the DB-dependent suites (session, db,
      # security-compat) against the same throwaway fixture Mongo the
      # compose stack uses — same dummy credentials, never published.
      mongo:
        image: mongo:9.0.4@sha256:ce91889f87a369d312e50ecbc6c0b7f960e915bc4b69c4f6662402fa7011d242
        env:
          MONGO_INITDB_ROOT_USERNAME: check_fixture
          MONGO_INITDB_ROOT_PASSWORD: check-fixture-only
          MONGO_INITDB_DATABASE: genieacs_plan_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      MONGO_URL: mongodb://check_fixture:check-fixture-only@localhost:27017/genieacs_plan_test?authSource=admin
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://check_fixture:check-fixture-only@localhost:27017/genieacs_plan_test?authSource=admin
      GENIEACS_UI_JWT_SECRET: check-fixture-jwt-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npx prettier --check --prose-wrap always .
      - name: Lint TypeScript
        run:
          npx eslint 'bin/*.ts' 'lib/**/*.ts' 'ui/**/*.ts' 'test/**/*.ts'
          'build/**/*.ts'
      - name: Check types
        run: npx tsc --noEmit
      - run: npm test
      - name: Build and verify service artifacts
        run: |
          npm run build
          for service in cwmp nbi fs ui; do
            test -s "dist/bin/genieacs-$service"
          done
          test -n "$(find dist/public -name '*.js' -print -quit)"
          test -n "$(find dist/public -name '*.css' -print -quit)"
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint --prefix apps/web
      - name: Typecheck frontend
        run: npm run typecheck --prefix apps/web
      - name: Frontend unit tests
        run: npm run test --prefix apps/web
      - name: Build frontend and verify standalone server
        run: |
          npm run build --prefix apps/web
          test -f apps/web/.next/standalone/apps/web/server.js

  # REQUIRED package gate: every suite registered in
  # scripts/check-suites.json runs against the isolated fixture stack
  # (auth-enabled throwaway Mongo, Vector, VictoriaLogs) via the
  # registry runner. check.mjs fails fast on the first nonzero child,
  # so one failing nested test fails this job — no missing-evidence
  # exit 0.
  packages:
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build verification images
        run:
          docker compose -f compose.test.yaml build verify victorialogs vector
          web vpn-build
      - name: Start the fixture mongo and wait for it
        run: |
          docker compose -f compose.test.yaml up -d mongo
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f compose.test.yaml ps -q mongo)")"
            if [ "$status" = "healthy" ]; then echo "mongo healthy"; exit 0; fi
            if [ "$status" != "starting" ]; then
              echo "::error::mongo health status: $status"
              docker compose -f compose.test.yaml logs mongo || true
              exit 1
            fi
            sleep 3
          done
          echo "::error::mongo never became healthy"
          docker compose -f compose.test.yaml logs mongo || true
          exit 1
      - name: Start the rest of the fixture stack
        run: docker compose -f compose.test.yaml up -d victorialogs vector web
      - name: Prime the web workspace dependencies
        run: >
          docker compose -f compose.test.yaml run --rm verify npm ci --prefix
          apps/web --no-audit --no-fund
      - name: Run every registered package suite
        run:
          docker compose -f compose.test.yaml run --rm verify node
          scripts/check.mjs all
      - name: Tear down the fixture stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

  # REQUIRED browser gate: Playwright against the REAL stack — engine
  # UI, fixture identities/devices, BFF login — through the e2e overlay
  # (compose.test.yaml alone is the no-engine acceptance scenario).
  e2e:
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the engine-backed stack images
        run: >
          docker compose -f compose.test.yaml -f compose.e2e.yaml build mongo
          victorialogs vector ui seed web browser-tests
      - name: Start the fixture mongo and wait for it
        run: |
          docker compose -f compose.test.yaml -f compose.e2e.yaml up -d mongo
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f compose.test.yaml ps -q mongo)")"
            if [ "$status" = "healthy" ]; then echo "mongo healthy"; exit 0; fi
            if [ "$status" != "starting" ]; then
              echo "::error::mongo health status: $status"
              docker compose -f compose.test.yaml logs mongo || true
              exit 1
            fi
            sleep 3
          done
          echo "::error::mongo never became healthy"
          docker compose -f compose.test.yaml logs mongo || true
          exit 1
      - name: Browser tests against the engine-backed stack
        run: >
          docker compose -f compose.test.yaml -f compose.e2e.yaml up -d
          victorialogs vector ui seed web browser-tests && docker compose -f
          compose.test.yaml -f compose.e2e.yaml up --abort-on-container-exit
          --exit-code-from browser-tests browser-tests
      - name: Engine structured-log acceptance on the same stack
        run: >
          docker compose -f compose.test.yaml -f compose.e2e.yaml run --rm
          engine-log-smoke
      - name: Tear down the e2e stack
        if: always()
        run:
          docker compose -f compose.test.yaml -f compose.e2e.yaml down -v
          --remove-orphans
